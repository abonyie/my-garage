function transmissionFor(v){return v?.transmission||(/kézi/i.test(v?.spec||'')?'manual':'unknown')}
function transmissionTask(v){const t=transmissionFor(v);return {title:t==='manual'?'Kézi váltóolaj ellenőrzése / cseréje':t==='dct'?'Duplakuplungos váltó olajának / szűrőjének ellenőrzése':t==='cvt'?'CVT váltófolyadék ellenőrzése / cseréje':t==='robotized'?'Robotizált váltó olajának ellenőrzése':t==='automatic'?'Automata váltóolaj ellenőrzése / cseréje':'Váltóolaj / váltótípus ellenőrzése',km:0,months:0,transmissionTask:true}}
function ensureTransmissionPlan(id){const v=vehicles[id],plan=db.maintenancePlans?.[id];if(!v||!plan)return;const t=transmissionFor(v),old=plan.items.find(x=>x.transmissionTask);if(old&&plan.transmissionType===t)return;const newTask=transmissionTask(v);if(old){newTask.km=old.km;newTask.months=old.months;plan.items.splice(plan.items.indexOf(old),1,newTask)}else{plan.items.push(newTask)}plan.transmissionType=t;plan.approved=false;save()}
function createMaintenancePlan(id,v){db.maintenancePlans||={};if(db.maintenancePlans[id])return;const kind=/elektromos|electric/i.test(v.spec)?'electric':'combustion';db.maintenancePlans[id]={kind,origin:'Tájékoztató, szerkeszthető sablon – nem gyári előírás',verified:false,items:[...maintenanceTemplates[kind].map(x=>({...x})),transmissionTask(v)],transmissionType:transmissionFor(v)}}

function planServiceEntries(car){
 const plan=db.maintenancePlans?.[car];if(!plan?.approved)return [];
 const today=new Date(),current=lastKm(car);
 return plan.items.map((item,i)=>{
  const title=item.title.toLocaleLowerCase('hu-HU');
  const rec=db.records.filter(r=>r.car===car).filter(r=>{
   const t=String(r.title||'').toLocaleLowerCase('hu-HU');
   if(title.includes('motorolaj'))return t.includes('motorolaj')||t.includes('olajcsere');
   if(title.includes('levegőszűrő'))return t.includes('levegő')||t.includes('szűrő')&&!t.includes('üzemanyag');
   if(title.includes('pollenszűrő'))return t.includes('pollen')||t.includes('utastér');
   if(title.includes('fékfolyadék'))return t.includes('fékfolyadék');
   return t.includes(title.split(' ')[0]);
  }).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const last=rec[0],date=last&&/^\d{4}-\d{2}-\d{2}$/.test(last.date)?new Date(last.date+'T12:00:00'):null;
  const deadline=date&&item.months>0?new Date(date):null;
  if(deadline)deadline.setMonth(deadline.getMonth()+Number(item.months));
  const kmDue=last&&item.km>0&&last.km!=null?Number(last.km)+Number(item.km):null;
  const due=Boolean((item.km>0||item.months>0)&&((deadline&&today>=deadline)||(kmDue!=null&&current!=null&&Number(current)>=kmDue)));
  const soon=Boolean(!due&&((deadline&&(deadline-today)/86400000<=30)||(kmDue!=null&&current!=null&&kmDue-Number(current)<=2000)));
  const detail=last?('Utolsó rögzített szerviz: '+last.date+(last.km!=null?' · '+last.km+' km':'')+'. '+(kmDue!=null?'Következő: '+kmDue+' km':'')+(deadline?' · '+deadline.toLocaleDateString('hu-HU'):'')+' (amelyik előbb bekövetkezik).'):'Nincs egyértelmű korábbi szervizadat. Az esedékesség még nem számítható.';
  return {id:'plan_'+car+'_'+i,car,title:item.title,status:due?'Esedékes':soon?'Hamarosan':last?'Tervezett':'Adat szükséges',detail};
 });
}

if(page==='addcar'){html=`<form id="carForm" class="panel"><h2>Új autó felvétele</h2><div class="panel" style="margin-bottom:16px"><h3>📸 Felvétel forgalmi engedély alapján</h3><p class="small muted">Készíts fényképet a forgalmi járműadatait tartalmazó oldaláról. A felismerés a telefonon fut, a képet nem mentjük. Jelöld ki a teljes okmányt két sarokkal. Ha az automatikus felismerés téved, külön kijelölheted az egyes adatmezőket is. Ha a szöveg nem olvasható, nem töltünk ki találomra mezőket. A felismeréshez egy nyílt forrású szövegfelismerő könyvtár töltődik le; internetkapcsolat szükséges.</p><div class="notice" style="margin:12px 0"><b>📷 Így fotózd le a forgalmit</b><p class="small">A piros kereten belül legyen a teljes, járműadatokat tartalmazó oldal. A D.1, D.2, D.3, E, P.1, P.2, P.3 és B mező legyen olvasható. A minta szemléltető ábra, nem valódi okmány.</p><img src="./forgalmi_foto_minta.png" alt="Szemléltető minta a forgalmi lefotózásához, piros kerettel jelölve a szükséges terület" style="width:100%;height:auto;border-radius:12px;display:block" loading="lazy"><p class="small">Tedd sík felületre, fényképezd felülről, jó fényben, csillogás és levágott szélek nélkül.</p></div><div class="row" style="gap:8px;flex-wrap:wrap"><button type="button" id="takeRegistrationPhoto" class="btn full">📷 Fotó készítése</button><button type="button" id="chooseRegistrationPhoto" class="btn light full">🖼 Kép kiválasztása</button></div><input id="registrationPhoto" type="file" accept="image/*" capture="environment" style="display:none"><input id="registrationGallery" type="file" accept="image/*" style="display:none"><img id="registrationPreview" alt="A kiválasztott forgalmi fényképének előnézete" style="display:none;width:100%;max-height:340px;object-fit:contain;margin:12px 0;border-radius:10px"><div class="notice" style="margin:10px 0"><b>🎯 Forgalmi körbevágása (ajánlott)</b><p class="small">A kép két pontjára koppints: először a forgalmi bal felső, majd a jobb alsó sarkára. Csak ásban</small></button><button type="button" class="btn light full" data-recolor-index="${i}" style="margin:5px 0 12px">✨ AI-s átszínezés</button>`).join('')+'</div>';area.querySelectorAll('[data-recolor-index]').forEach(b=>b.onclick=()=>openAIRecolor(unique[Number(b.dataset.recolorIndex)]));area.querySelectorAll('[data-photo-index]').forEach(b=>b.onclick=()=>{const x=unique[Number(b.dataset.photoIndex)];if(!confirm('Ezt a képet állítod be az autóhoz? Ellenőrizd, hogy a modell és a szín valóban megfelelő.'))return;db.photos[carId]=x.thumb;db.photoCredits||={};db.photoCredits[carId]={page:x.page,credit:x.license||'Wikimedia Commons',title:x.title};save();go('detail',carId)})}
